spring.application.name=dispute-service
server.port=8084
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=dispute_schema
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=dispute_schema

jwt.secret=${JWT_SECRET}
internal.api-key=${INTERNAL_API_KEY}

project.url=${PROJECT_SERVICE_URL:http://localhost:8082}
escrow.url=${ESCROW_SERVICE_URL:http://localhost:8083}