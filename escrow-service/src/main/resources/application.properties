spring.application.name=escrow-service
server.port=8083
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=escrow_schema
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=escrow_schema

jwt.secret=${JWT_SECRET}
internal.api-key=${INTERNAL_API_KEY}

# platform fee percent (5 = 5%)
escrow.platform-fee-percent=5