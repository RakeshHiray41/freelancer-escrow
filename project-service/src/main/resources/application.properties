spring.application.name=project-service
server.port=8082
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=project_schema
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=project_schema

jwt.secret=${JWT_SECRET}
internal.api-key=${INTERNAL_API_KEY}

escrow.url=${ESCROW_SERVICE_URL:http://localhost:8083}
user.url=${USER_SERVICE_URL:http://localhost:8081}
notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}